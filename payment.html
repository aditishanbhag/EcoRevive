<!DOCTYPE html>
<html>
<head>
<title>Payment</title>
<style>
.container { max-width:400px; margin:80px auto; text-align:center; }
input { width:100%; padding:10px; margin:10px 0; }
button { padding:12px; background:#2fbf71; color:white; border:none; width:100%; }
</style>
</head>

<body>

<div class="container">
<h2>💳 Payment</h2>

<input placeholder="Card Number">
<input placeholder="Expiry Date">
<input placeholder="CVV">

<button onclick="pay()">Pay Now</button>
</div>

<script>
function pay(){
  alert("Payment Successful! 🌿");

  // deduct eco points
  fetch("http://localhost:3000/api/deductPoints", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ points: 50 })
  });

  localStorage.removeItem("cart");
  window.location.href="marketplace.html";
}
</script>

</body>
</html>
